name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsodium-dev \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            socat python3
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsodium-dev \
            clang socat python3
      - name: Configure
        run: >
          cmake -S . -B build-san -DCMAKE_CXX_COMPILER=clang++
          -DWISP_SANITIZE=ON -DWISP_LTO=OFF -DWISP_BUILD_APP=OFF
      - name: Build
        run: cmake --build build-san -j"$(nproc)"
      - name: Unit tests
        run: ./build-san/tests/wisp_tests
      - name: Integration test
        run: WISP_BUILD_DIR=build-san ./scripts/integration-test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Static analysis
        run: >
          cppcheck --enable=warning,performance,portability --std=c++20
          --inline-suppr --error-exitcode=1
          -I core/include core/src helper bench tests fuzz
