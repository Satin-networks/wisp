# Wisp profile template
#
# Copy to providers/.work/<name>.conf, fill in the four values from your
# provider, then validate before installing:
#
#   wispd --dry-run --fail-closed   (then: UP <name>)
#
# Placeholders below fail validation on purpose, so an unfilled template can
# never come up as a working tunnel. See docs/PROFILES.md for the key rules
# and docs/PROVIDERS.md for the free-provider list.

[Interface]
PrivateKey = PASTE_YOUR_PRIVATE_KEY_HERE
Address = 10.0.0.2/32
DNS = 10.64.0.1

[Peer]
PublicKey = PASTE_PEER_PUBLIC_KEY_HERE
Endpoint = 203.0.113.1:51820
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25
